[project]
name = "floci-mcp"
version = "0.1.0"
description = "MCP server exposing the local floci-gcp GCP emulator to Claude Code"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.0,<3",
    "httpx>=0.27",
]

[project.scripts]
floci-mcp = "floci_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["floci_mcp"]
